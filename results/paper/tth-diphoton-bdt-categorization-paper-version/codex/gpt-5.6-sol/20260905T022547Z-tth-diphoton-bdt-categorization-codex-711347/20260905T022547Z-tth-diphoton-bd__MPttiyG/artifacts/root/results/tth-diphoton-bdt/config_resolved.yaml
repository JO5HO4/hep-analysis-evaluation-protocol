input_root: /data/GamGam
input_source: TB_HYY_INPUTS
output_root: /root/results/tth-diphoton-bdt
allowed_mc_processes:
- ggH
- VBF
- WH
- ZH
- ggZH
- ttH
- tH
observed_data: /data/GamGam/data/data_preselection.root
integrated_luminosity_fb: 36.0
random_seed: 240513
partition_fractions:
  train: 0.6
  validation: 0.2
  test: 0.2
max_selected_per_sample: null
row_policy: uncapped (default)
bdt_features:
- n_central_jets
- n_bjets
- jet1_pt
- jet_ht
- diphoton_pt
blinding: observed TI data 120-130 GeV omitted before analysis row construction
