# Resolved configuration for tth-diphoton-bdt analysis
# This file is generated by the pipeline

# Input
inputs:
  gamgam_root_dir: "${TB_HYY_INPUTS}"

# Selection
photon:
  pt_min: 20.0  # GeV, kinematic acceptance
  # No tight ID or isolation required for preselection

lepton:
  pt_min: 10.0  # GeV
  # No ID or isolation required

jet:
  pt_min: 25.0  # GeV
  central_eta_max: 2.5
  btag_quantile_min: 4  # b-tag definition

# Analysis channels
channels:
  hadronic:
    n_leptons: 0
    n_jets_min: 3
    n_bjets_min: 1
  # Optional: leptonic bookkeeping (not used in BDT)
  leptonic_bookkeeping:
    n_leptons_min: 1
    n_bjets_min: 1

# BDT
bdt_features:
  - "jet_pt_sum"
  - "jet_eta_max"
  - "bjet_pt_max"
  - "bjet_eta_max"
  - "diphoton_pt"

# Signal definition
signal_processes:
  - "ttH"
  - "tH"

# Background definition for BDT training
bdt_background:
  resonant:
    - "ggH"
  continuum:
    source: "data"
    control_region: "NTI"  # Non-Tight-Isolated
    sidebands:
      low: [105, 120]  # GeV
      high: [130, 160]  # GeV
    mass_window: [123, 127]  # 125 +/- 2 GeV

# NTI scale factors
nti_scale_factors:
  # SF1 = TI_sideband_yield / NTI_sideband_yield
  # SF2 = NTI_signal_window_yield / NTI_sideband_yield
  # SF_total = SF1 * SF2
  compute_during_training: true

# Class balancing
balance_classes: true  # After physical normalization

# Training
training:
  model_type: "XGBoost"
  random_seed: 42
  test_size: 0.2
  validation_size: 0.2  # of remaining (after test split)

# Boundary optimization
boundary_optimization:
  min_improvement: 0.05  # 5%
  max_boundaries: 10

# Output
output_dir: "/root/results/tth-diphoton-bdt"

# Throttling
max_selected_per_sample: ${TTH_MAX_SELECTED_PER_SAMPLE:-0}  # 0 means no limit
